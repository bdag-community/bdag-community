# When explicitly enabled, deploy to production on every push to main — including PR
# merges. Also runnable by hand via the Actions tab (workflow_dispatch).
#
# DEPLOY TARGET: currently pointed at the same xneelo VM that serves
# bdag-miner-sales (154.65.106.86), where this site gets its own
# /opt/bdag-community tree, container, local port (3001), and Caddy site
# block for bdag.community. Update SERVER below if it gets its own VM.
#
# The ONLY GitHub secret required is DEPLOY_SSH_KEY (a dedicated ed25519
# private key whose public half is in the server's authorized_keys). App
# secrets live in /opt/bdag-community/bdag-community.env ON the server and
# never touch GitHub.
name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  SERVER: 154.65.106.86

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.XNEELO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          test -n "$DEPLOY_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Ship source to server
        run: |
          git archive HEAD | gzip | ssh -i ~/.ssh/deploy_key ubuntu@"$SERVER" \
            'rm -rf /opt/bdag-community/src && mkdir -p /opt/bdag-community/src && tar xzf - -C /opt/bdag-community/src'

      - name: Read public build configuration
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@"$SERVER" 'python3 -' > /tmp/public-build.json <<'PYTHON'
          import json
          from pathlib import Path
          values=dict(line.split('=',1) for line in Path('/opt/bdag-community/bdag-community.env').read_text().splitlines() if '=' in line and not line.startswith('#'))
          names=['NEXT_PUBLIC_SUPABASE_URL','NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY','NEXT_PUBLIC_TURNSTILE_SITE_KEY','ASSET_STORAGE_ENVIRONMENT','ASSET_DELIVERY_ORIGIN']
          print(json.dumps({k:values[k] for k in names}))
          PYTHON

      - name: Build image on native AMD64 runner
        run: |
          python3 - <<'PYTHON'
          import json,os,subprocess
          values=json.load(open('/tmp/public-build.json'))
          args=['docker','build','--label','org.opencontainers.image.revision='+os.environ['GITHUB_SHA'],'-t','bdag-community:verified-'+os.environ['GITHUB_SHA']]
          for k,v in values.items():args+=['--build-arg',k+'='+v]
          subprocess.run(args+['.'],check=True)
          PYTHON

      - name: Transfer verified image and swap healthy candidate
        run: |
          set -o pipefail
          docker save bdag-community:verified-${{ github.sha }} | gzip | ssh -i ~/.ssh/deploy_key ubuntu@"$SERVER" 'gunzip | docker load'
          ssh -i ~/.ssh/deploy_key ubuntu@"$SERVER" \
            'install -m 0755 /opt/bdag-community/src/ops/deploy.sh /opt/bdag-community/deploy.sh && BDAG_PREBUILT_IMAGE=bdag-community:verified-${{ github.sha }} bash /opt/bdag-community/deploy.sh'

      - name: Verify public health
        run: |
          sleep 5
          curl -sf --max-time 20 https://bdag.community/api/health
